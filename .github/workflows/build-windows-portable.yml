name: Build Windows portable

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows portable
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: npm install

      - name: Download local recipe runtime
        run: npm run recipe-parser:download-runtime

      - name: Prepare ffmpeg for transcription helper
        shell: powershell
        run: |
          choco install ffmpeg -y --no-progress
          $ffmpeg = (Get-Command ffmpeg.exe).Source
          New-Item -ItemType Directory -Force transcription-service/vendor/ffmpeg/bin | Out-Null
          Copy-Item -LiteralPath $ffmpeg -Destination transcription-service/vendor/ffmpeg/bin/ffmpeg.exe -Force

      - name: Build transcription helper
        run: npm run transcription:build-helper

      - name: Build web app
        run: npm run build

      - name: Build portable app
        run: npm run electron:build:x64 -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: taste-and-trace-windows-portable
          path: |
            release/*-Portable-*-x64.exe
          if-no-files-found: error
